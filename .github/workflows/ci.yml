name: ci
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Expected release candidate commit (empty for an ordinary manual run)
        default: ''
        type: string
      producer_run_id:
        description: Trusted release workflow run
        default: ''
        type: string
      producer_attempt:
        description: Trusted release workflow attempt
        default: ''
        type: string
  pull_request:
    branches:
      - main
      # Keep CI available until the maintained branch is renamed.
      - coreweave
  push:
    branches:
      - main
      - coreweave
permissions:
  contents: read
jobs:
  release-preflight:
    runs-on: cw-static-pub-x64-4c
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Verify release candidate
      if: github.event_name == 'workflow_dispatch' && inputs.expected_head != ''
      run: python3 scripts/release_gate.py ci-preflight
      env:
        GH_TOKEN: ${{ github.token }}
        EXPECTED_HEAD: ${{ inputs.expected_head }}
        PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
        PRODUCER_ATTEMPT: ${{ inputs.producer_attempt }}
  build:
    needs: release-preflight
    strategy:
      matrix:
        go-version:
          - 1.22.x
          - 1.21.x
          - 1.20.x
        os: [macos, ubuntu, windows]
        include:
          - os: macos
            goos: darwin
            goarch: arm64
          - os: ubuntu
            goos: linux
            goarch: amd64
          - os: windows
            goos: windows
            goarch: amd64

    name: build (${{ matrix.os }}/go-${{ matrix.go-version }})
    runs-on: cw-static-pub-x64-4c
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}

    - run: make build
      env:
        CGO_ENABLED: '0'
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}

  test:
    needs: release-preflight
    strategy:
      matrix:
        go-version:
          - 1.22.x
          - 1.21.x
          - 1.20.x
    name: test (ubuntu/go-${{ matrix.go-version }})
    runs-on: cw-static-pub-x64-4c
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}

    - name: Build pinned local test storage
      run: GOBIN="$RUNNER_TEMP/minio-bin" go install github.com/minio/minio@0120ff93bc4b9cfaf2865e55850e9b20e5ef703d # RELEASE.2023-07-18T17-49-40Z
    - name: Run tests
      shell: bash
      run: |
        "$RUNNER_TEMP/minio-bin/minio" server "$RUNNER_TEMP/minio-data" --address 127.0.0.1:45677 >"$RUNNER_TEMP/minio.log" 2>&1 &
        minio_pid=$!
        trap 'kill "$minio_pid" 2>/dev/null || true; wait "$minio_pid" 2>/dev/null || true' EXIT
        for ((attempt=0; attempt<30; attempt++)); do
          if curl --fail --silent --max-time 2 "$S5CMD_TEST_ENDPOINT_URL/minio/health/live" >/dev/null; then
            break
          fi
          sleep 1
        done
        if ! curl --fail --silent --max-time 2 "$S5CMD_TEST_ENDPOINT_URL/minio/health/live" >/dev/null; then
          echo 'Local test storage did not become healthy.'
          exit 1
        fi
        make test
      env:
        S5CMD_TEST_ENDPOINT_URL: http://localhost:45677
        MINIO_ROOT_USER: minioadmin
        MINIO_ROOT_PASSWORD: minioadmin
  qa:
    needs: release-preflight
    strategy:
      matrix:
        go-version:
          - 1.22.x
          - 1.21.x
          - 1.20.x
    name: qa (${{ matrix.go-version }}, ubuntu)
    runs-on: cw-static-pub-x64-4c
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}

    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.11'
    - name: Install pinned Semgrep without a container pull
      run: python -m pip install --disable-pip-version-check semgrep==1.65.0
    - run: make bootstrap
    - run: make check

  credential-helper:
    needs: release-preflight
    runs-on: cw-static-pub-x64-4c
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - run: python3 -m unittest discover -s scripts -p 'test_*.py'
